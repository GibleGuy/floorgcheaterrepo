<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Floorg Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-icon">🎮</div>
      <div class="header-text">
        <h1>The Floorg</h1>
        <p class="subtitle">Auto Reverse Image Search</p>
      </div>
    </header>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner status-disabled">
      <span class="status-dot"></span>
      <span id="status-text">Disabled</span>
    </div>

    <!-- Main Toggle -->
    <div class="control-row main-toggle">
      <label for="toggle-enabled">Enable Auto-Search</label>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Divider -->
    <hr class="divider">

    <!-- Search Settings -->
    <section class="section">
      <h2 class="section-title">🔍 Search Settings</h2>

      <div class="form-group">
        <label for="search-phrase">Custom search phrase <span class="optional">(optional)</span></label>
        <input type="text" id="search-phrase" placeholder='e.g. "who is this persons parents"'>
        <small class="help-text">
          Added to the image search to guide AI Overview results.<br>
          Leave blank for a plain reverse image search.
        </small>
      </div>

      <button id="save-settings" class="btn btn-primary">Save</button>
    </section>

    <!-- Divider -->
    <hr class="divider">

    <!-- Activity Log -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">📋 Activity Log</h2>
        <div>
          <button id="copy-log" class="btn-text">Copy</button>
          <button id="clear-log" class="btn-text">Clear</button>
        </div>
      </div>
      <div id="log-container" class="log-container">
        <div class="log-empty">No activity yet. Enable the helper and join a game!</div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
